<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIDL 2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1322; --panel:#141f36; --line:#2b3b5e; --ink:#eef2f9; --muted:#9db0cf; --accent:#e2603f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"VT323",ui-monospace,monospace;overflow:hidden}
  #view{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .panel{position:fixed;background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:2}
  #brand{top:16px;left:16px;padding:12px 16px 14px;width:320px}
  #brand h1{margin:0;font-family:"Press Start 2P",ui-monospace,monospace;font-size:24px;line-height:1.2;font-weight:400}
  #brand h1 span{color:var(--accent)}
  #brand .sub{color:var(--muted);font-size:20px;margin-top:8px}
  #stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px;font-size:20px}
  #stats div{display:flex;align-items:center;gap:6px}
  #stats i{display:inline-block;width:10px;height:10px;flex:none}
  #stats b{margin-left:auto}
  #updated{margin-top:8px;font-size:17px;color:var(--muted)}
  #ticker{top:16px;left:352px;right:192px;height:46px;display:flex;align-items:center;overflow:hidden;padding:0 0 0 8px}
  #ticker .badge{flex:none;background:var(--accent);color:#fff;padding:2px 10px;margin-right:10px;font-size:22px;letter-spacing:1px}
  #ticker .wrap{overflow:hidden;flex:1;height:100%;display:flex;align-items:center}
  #ticker .track{white-space:nowrap;display:inline-block;padding-left:100%;font-size:26px;animation:scroll var(--dur,60s) linear infinite}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  #weather{top:16px;right:16px;height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:24px;width:160px}
  #weather span{color:var(--muted)}
  #clock{left:16px;bottom:16px;padding:6px 12px;font-size:20px;color:var(--muted)}
  #clock b{color:var(--ink);font-size:26px}
  #legend{right:16px;bottom:16px;padding:10px 14px;font-size:19px;display:grid;gap:2px}
  #legend div{display:flex;gap:8px;align-items:center}
  #legend i{display:inline-block;width:10px;height:10px;flex:none}
  #credit{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:17px;color:#5f7092;z-index:2;white-space:nowrap}
  @media (max-width:900px){
    #brand{width:auto;right:16px}
    #ticker{left:16px;right:16px;top:auto;bottom:64px}
    #weather,#legend,#credit{display:none}
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Pixelové městečko: každý účastník Setkání má parcelu a jeho projekt na ní roste podle stavu na Miro nástěnce."></canvas>
<div id="brand" class="panel">
  <h1>AIDL <span>2000</span></h1>
  <div class="sub">Setkání S05 jako hra z 90. let</div>
  <div id="stats"></div>
  <div id="updated"></div>
</div>
<div id="ticker" class="panel"><div class="badge">ŽIVĚ</div><div class="wrap"><div class="track" id="track"></div></div></div>
<div id="weather" class="panel">☁️ 2 °C <span>Brno</span></div>
<div id="clock" class="panel"></div>
<div id="legend" class="panel"></div>
<div id="credit">Inspirace: brno2000.cz · Data: Miro nástěnka AIDL S05</div>

<script>
(() => {
'use strict';
// ---------- konstanty ----------
const W = 640, H = 360, TW = 32, TH = 16, N = 13, OX = 320, OY = 94;
const STAGES = ['volba', 'jedu', 'zpomaluju', 'stojim', 'oponentura', 'hotovo'];
const STAGE_LABEL = { volba: 'Výkop', jedu: 'Jedu', zpomaluju: 'Zpomaluju', stojim: 'Stojím', oponentura: 'Oponentura', hotovo: 'Hotovo' };
const STAGE_COL = { volba: '#a9b4c8', jedu: '#7ed957', zpomaluju: '#f5d128', stojim: '#f0606d', oponentura: '#b893ff', hotovo: '#ffcf4a' };
const LEGEND = [
  ['volba', 'Výkop: karta volby'],
  ['jedu', 'Jeřáb: Jedu'],
  ['zpomaluju', 'Žlutý maják: Zpomaluju'],
  ['stojim', 'Kužely a odtahovka: Stojím'],
  ['oponentura', 'Inspektor: Oponentura'],
  ['hotovo', 'Ohňostroj: Galerie']
];
const HEIGHT = { volba: 0, jedu: .5, zpomaluju: .5, stojim: .5, oponentura: .85, hotovo: 1 };
const LAYOUT = {
  pavelm: { i: 1, j: 0, theme: 'cards',  color: '#d9825b' },
  tereza: { i: 2, j: 0, theme: 'bike',   color: '#e48fb3' },
  pavelg: { i: 0, j: 1, theme: 'calc',   color: '#79b866' },
  aneta:  { i: 2, j: 1, theme: 'meet',   color: '#e0a548' },
  daniel: { i: 0, j: 2, theme: 'plan',   color: '#6aa3d8' },
  tomas:  { i: 1, j: 2, theme: 'chart',  color: '#9b7fd6' },
  david:  { i: 2, j: 2, theme: 'harbor', color: '#e8e2d0' }
};
const MSG = {
  volba: n => `${n} kope základy`,
  jedu: n => `${n} zvedá jeřáb`,
  zpomaluju: n => `${n}: stavba zpomaluje`,
  stojim: n => `${n}: stavba stojí, odtahovka Nikol vyjíždí`,
  oponentura: n => `${n}: na stavbě je inspekce se třemi klobouky`,
  hotovo: (n, p) => `KOLAUDACE: ${n} dostavěl(a) ${p}`
};

// ---------- plátna ----------
const view = document.getElementById('view');
const v = view.getContext('2d');
const low = document.createElement('canvas'); low.width = W; low.height = H;
const c = low.getContext('2d');
const ground = document.createElement('canvas'); ground.width = W; ground.height = H;

// ---------- pomocníci ----------
const R = Math.round;
const P = (x, y, z = 0) => [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2 - z];
const frac = x => x - Math.floor(x);
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const k = x => Math.max(0, Math.min(255, R(x * f))); return `rgb(${k(n >> 16)},${k(n >> 8 & 255)},${k(n & 255)})`; }
function poly(ctx, pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.closePath(); ctx.fill(); }
function seg(ctx, a, b, col, w = 1) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function px(x, y, col, w = 1, h = 1) { c.fillStyle = col; c.fillRect(R(x), R(y), w, h); }
function flat(ctx, x, y, w, d, z, fill) { poly(ctx, [P(x, y, z), P(x + w, y, z), P(x + w, y + d, z), P(x, y + d, z)], fill); }
function box(x, y, w, d, h, col, z0 = 0) {
  poly(c, [P(x, y + d, z0), P(x + w, y + d, z0), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)], shade(col, .82));
  poly(c, [P(x + w, y + d, z0), P(x + w, y, z0), P(x + w, y, z0 + h), P(x + w, y + d, z0 + h)], shade(col, .62));
  flat(c, x, y, w, d, z0 + h, shade(col, 1.08));
}
// pozice na obvodu bloku: s v [0,4), strana 0 = zadní pravá, 1 = přední pravá, 2 = přední levá, 3 = zadní levá
function ringXY(bx, by, inset, s) {
  const a = inset, b = 3 - inset;
  const C = [[bx + a, by + a], [bx + b, by + a], [bx + b, by + b], [bx + a, by + b]];
  const side = Math.floor(s) % 4, f = s - Math.floor(s);
  const p0 = C[side], p1 = C[(side + 1) % 4];
  return { x: p0[0] + (p1[0] - p0[0]) * f, y: p0[1] + (p1[1] - p0[1]) * f, side };
}

// ---------- terén ----------
const isRoad = (x, y) => x % 4 === 0 || y % 4 === 0;
const isWater = (x, y) => x >= 9 && x <= 11 && y >= 10 && y <= 11;
const stars = Array.from({ length: 60 }, (_, k) => { const r = rng(k + 100); return [r() * W, r() * H, r() < .2]; });
function buildGround() {
  const gc = ground.getContext('2d');
  const r = rng(7);
  const L = P(0, N), B = P(N, N), Rt = P(N, 0), D = 16;
  poly(gc, [L, B, [B[0], B[1] + D], [L[0], L[1] + D]], '#7a4b2c');
  poly(gc, [B, Rt, [Rt[0], Rt[1] + D], [B[0], B[1] + D]], '#5c3820');
  for (const d of [5, 10]) {
    seg(gc, [L[0], L[1] + d], [B[0], B[1] + d], '#6a3f24');
    seg(gc, [B[0], B[1] + d], [Rt[0], Rt[1] + d], '#4d2f1b');
  }
  poly(gc, [P(0, 0), P(N, 0), P(N, N), P(0, N)], '#5c8a3b');
  const grass = ['#5c8a3b', '#62913f', '#578437', '#5f8e3c'];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const col = isWater(x, y) ? '#3f7fc4' : isRoad(x, y) ? '#5a5e66' : grass[(r() * 4) | 0];
    poly(gc, [P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)], col);
    if (!isRoad(x, y) && !isWater(x, y)) {
      for (let k = 0; k < 7; k++) { const p = P(x + r(), y + r()); gc.fillStyle = r() < .5 ? '#4d7631' : '#79a64c'; gc.fillRect(R(p[0]), R(p[1]), 1, 1); }
    }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!isRoad(x, y)) continue;
    const hz = y % 4 === 0, vt = x % 4 === 0;
    if (hz && !vt) seg(gc, P(x + .3, y + .5), P(x + .7, y + .5), '#cfcfbf');
    if (vt && !hz) seg(gc, P(x + .5, y + .3), P(x + .5, y + .7), '#cfcfbf');
  }
  seg(gc, L, B, '#86b356'); seg(gc, B, Rt, '#6f9a45');
}

// ---------- stav ----------
const params = new URLSearchParams(location.search);
const forced = params.get('stage');
let demo = params.has('demo');
const parcels = {};
let STATE = null;
const events = [];
let loadedOnce = false;
const t0 = performance.now();
const now = () => (performance.now() - t0) / 1000;

function getStage(p) {
  if (demo) return STAGES[Math.floor(now() / 4 + (p.seed % 6)) % 6];
  if (forced && STAGES.includes(forced)) return forced;
  return p.stage;
}
function hhmm() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

function applyState(s) {
  if (!s || !Array.isArray(s.parcels)) return;
  STATE = s;
  for (const q of s.parcels) {
    const L = LAYOUT[q.id]; if (!L) continue;
    const stage = STAGES.includes(q.stage) ? q.stage : 'volba';
    let p = parcels[q.id];
    if (!p) {
      const seed = hash(q.id);
      p = parcels[q.id] = { id: q.id, layout: L, seed, h: 0, fullH: (L.theme === 'harbor' ? 26 : 32) + seed % 12, stage, flash: 0, fw: 30 };
    } else if (p.stage !== stage) {
      p.stage = stage; p.flash = 4;
      if (loadedOnce) {
        events.push(`${hhmm()} ${MSG[stage](q.name, q.project)}`);
        if (stage === 'hotovo') p.fw = 0;
      }
    }
    p.name = q.name; p.project = q.project;
  }
  loadedOnce = true;
  document.getElementById('updated').textContent = s.updated ? `Data z Mira: ${s.updated}` : '';
  updateTicker(); updateStats();
}
function loadState() {
  const s = document.createElement('script');
  s.src = 'state.js?t=' + Date.now();
  s.onload = () => { applyState(window.AIDL_STATE); s.remove(); };
  s.onerror = () => s.remove();
  document.body.appendChild(s);
}

let tickerText = '';
function updateTicker() {
  const parts = [];
  for (const e of events.slice(-6).reverse()) parts.push(`NOVÉ · ${e}`);
  for (const s of (STATE && STATE.ticker) || []) parts.push(s);
  const txt = parts.join('   +++   ');
  if (txt === tickerText) return;
  tickerText = txt;
  const tr = document.getElementById('track');
  tr.textContent = txt + '   +++   ';
  tr.style.setProperty('--dur', Math.max(25, txt.length * .17) + 's');
}
function updateStats() {
  const cnt = Object.fromEntries(STAGES.map(s => [s, 0]));
  for (const id in parcels) cnt[getStage(parcels[id])]++;
  document.getElementById('stats').innerHTML = STAGES.map(s =>
    `<div><i style="background:${STAGE_COL[s]}"></i>${STAGE_LABEL[s]}<b>${cnt[s]}</b></div>`).join('');
}
document.getElementById('legend').innerHTML = LEGEND.map(([s, t]) => `<div><i style="background:${STAGE_COL[s]}"></i>${t}</div>`).join('');
function tickClock() {
  const d = new Date(); const days = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
  const z = n => String(n).padStart(2, '0');
  document.getElementById('clock').innerHTML = `${days[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()} <b>${z(d.getHours())}:${z(d.getMinutes())}</b>:${z(d.getSeconds())}`;
}

// ---------- doprava a mraky ----------
const cars = (() => {
  const r = rng(3), cols = ['#e94f37', '#f6f7eb', '#3f88c5', '#f2bb05', '#44bba4', '#8d99ae', '#ff8fab', '#2ec4b6'];
  return Array.from({ length: 9 }, (_, k) => ({ axis: k % 2 ? 'h' : 'v', line: [0, 4, 8][k % 3], p: r() * N, v: (r() < .5 ? 1 : -1) * (.5 + r() * .6), col: cols[k % cols.length] }));
})();
const clouds = Array.from({ length: 7 }, (_, k) => ({ x: (k * 117) % W, y: 14 + ((k * 47) % 120), s: .05 + (k % 3) * .025, w: 14 + (k * 7) % 14 }));
let particles = [];

// ---------- kreslení parcel ----------
function windows(p, fp, h, t, theme) {
  const r = rng(p.seed);
  const plan = ['#7ed957', '#7ed957', '#f5a623', '#f0606d'];
  for (let z = 5, row = 0; z < h - 3; z += 6, row++) {
    for (const side of [0, 1]) {
      if (theme === 'chart' && side === 1) continue;
      for (let k = 1; k <= 3; k++) {
        const f = k / 4;
        let col = r() < .62 ? '#ffe8a3' : '#33415f';
        if (theme === 'plan') col = plan[(row * 3 + k + side * 2 + Math.floor(t / 1.5)) % plan.length];
        const pt = side === 0 ? P(fp.x + f * fp.w, fp.y + fp.d, z) : P(fp.x + fp.w, fp.y + fp.d - f * fp.d, z);
        px(pt[0] - 1, pt[1] - 2, col, 2, 2);
      }
    }
  }
}
function scaffold(fp, Hh, alpha) {
  const col = `rgba(230,150,70,${alpha})`;
  const e = .08, x = fp.x - e, y = fp.y - e, w = fp.w + 2 * e, d = fp.d + 2 * e;
  for (let k = 0; k <= 4; k++) {
    const f = k / 4;
    seg(c, P(x + f * w, y + d, 0), P(x + f * w, y + d, Hh), col);
    seg(c, P(x + w, y + d - f * d, 0), P(x + w, y + d - f * d, Hh), col);
  }
  for (let z = 6; z <= Hh; z += 6) {
    seg(c, P(x, y + d, z), P(x + w, y + d, z), col);
    seg(c, P(x + w, y + d, z), P(x + w, y, z), col);
  }
  seg(c, P(x, y, Hh), P(x + w, y, Hh), col);
  seg(c, P(x, y, Hh), P(x, y + d, Hh), col);
}
function crane(p, st, t, bx, by) {
  const mx = bx + 2.8, my = by + .22, Hh = p.fullH + 24;
  const base = P(mx, my, 0), top = P(mx, my, Hh);
  seg(c, [base[0] - 1, base[1]], [top[0] - 1, top[1]], '#e8b923');
  seg(c, [base[0] + 1, base[1]], [top[0] + 1, top[1]], '#e8b923');
  for (let z = 0; z < Hh; z += 4) { const q = P(mx, my, z); seg(c, [q[0] - 1, q[1]], [q[0] + 1, q[1] - 4], '#c99a12'); }
  const speed = st === 'jedu' ? .5 : st === 'zpomaluju' ? .12 : 0;
  const a = (p.seed % 628) / 100 + t * speed;
  const end = P(mx + Math.cos(a) * 2.6, my + Math.sin(a) * 2.6, Hh);
  const cw = P(mx - Math.cos(a) * .8, my - Math.sin(a) * .8, Hh);
  seg(c, cw, end, '#e8b923', 2);
  px(cw[0] - 2, cw[1] - 1, '#555', 4, 3);
  px(top[0] - 2, top[1] + 1, '#f2f2f2', 4, 3);
  const hook = 12 + (speed ? 6 * Math.sin(t * 1.3 + p.seed) : 0);
  seg(c, end, [end[0], end[1] + hook], '#dddddd');
  px(end[0] - 1, end[1] + hook, '#cc3333', 3, 3);
  if (st !== 'jedu' && Math.floor(t * 3) % 2 === 0) px(top[0] - 1, top[1] - 3, st === 'stojim' ? '#ff3b3b' : '#ffd400', 3, 2);
}
function cones(bx, by) {
  for (const [u, w] of [[.3, 2.9], [1.1, 2.9], [1.9, 2.9], [2.9, 2.1], [2.9, 1.3]]) {
    const q = P(bx + u, by + w, 0);
    px(q[0] - 1, q[1] - 4, '#ff7a1a', 3, 4); px(q[0] - 1, q[1] - 2, '#ffffff', 3, 1);
  }
}
function towTruck(x, y, t, blink) {
  box(x, y, .45, .95, 4, '#f2c230');
  box(x, y + .6, .45, .35, 3, '#e9e9e9', 4);
  seg(c, P(x + .22, y, 4), P(x + .22, y - .35, 1), '#333333');
  if (blink && Math.floor(t * 4) % 2) { const q = P(x + .22, y + .75, 7); px(q[0] - 1, q[1] - 2, '#ff8c00', 3, 2); }
}
function person(q, body, hat) {
  px(q[0] - 1, q[1] - 6, body, 3, 4);
  px(q[0] - 1, q[1] - 8, '#f1c27d', 3, 2);
  if (hat) { px(q[0] - 2, q[1] - 9, hat, 5, 1); px(q[0] - 1, q[1] - 10, hat, 3, 1); }
  px(q[0] - 1, q[1] - 2, '#222', 1, 2); px(q[0] + 1, q[1] - 2, '#222', 1, 2);
}
function inspector(bx, by, t) {
  const s = 1 + (Math.sin(t * .3) + 1);           // jen přední strany, ať nechodí přes dům
  const r = ringXY(bx, by, .2, Math.min(2.99, s)), q = P(r.x, r.y);
  const hats = ['#ffffff', '#222222', '#f5d128'];
  person(q, '#2d4b8c', hats[Math.floor(t / 2) % 3]);
  px(q[0] + 2, q[1] - 6, '#c8a165', 2, 3);
  if (Math.floor(t) % 3 === 0) {
    px(q[0] + 3, q[1] - 17, '#ffffff', 5, 6);
    px(q[0] + 4, q[1] - 16, '#b893ff', 3, 1); px(q[0] + 6, q[1] - 15, '#b893ff', 1, 1); px(q[0] + 5, q[1] - 14, '#b893ff', 1, 1); px(q[0] + 5, q[1] - 12, '#b893ff', 1, 1);
  }
}
function cyclist(bx, by, t) {
  const r = ringXY(bx, by, .15, (t * .3) % 4), q = P(r.x, r.y);
  return { back: r.side === 0 || r.side === 3, draw: () => {
    px(q[0] - 2, q[1] - 1, '#111', 1, 1); px(q[0] + 1, q[1] - 1, '#111', 1, 1);
    px(q[0] - 1, q[1] - 4, '#1d3557', 2, 3); px(q[0] - 1, q[1] - 5, '#f5d128', 2, 1);
  } };
}
function dog(bx, by, t) {
  const s = 1 + (Math.sin(t * .5) + 1);
  const r = ringXY(bx, by, .25, Math.min(2.99, s)), q = P(r.x, r.y);
  const hop = Math.floor(t * 6) % 2;
  px(q[0] - 2, q[1] - 3 - hop, '#8b5a2b', 4, 2); px(q[0] + 2, q[1] - 4 - hop, '#8b5a2b', 2, 2);
  px(q[0] - 3, q[1] - 4 - hop, '#8b5a2b', 1, 1); px(q[0] - 2, q[1] - 1, '#5a3a1a', 1, 1); px(q[0] + 1, q[1] - 1, '#5a3a1a', 1, 1);
}
function flag(fp, h, t, col) {
  const q = P(fp.x + fp.w * .5, fp.y + fp.d * .5, h);
  seg(c, q, [q[0], q[1] - 12], '#dddddd');
  const wv = Math.floor(t * 4) % 2;
  px(q[0] + 1, q[1] - 12, col, 6, 2); px(q[0] + 1 + wv, q[1] - 10, col, 6, 2);
}
function burst(pt, n = 28) {
  const cols = ['#ffcf4a', '#f0606d', '#7ed957', '#5aa0e0', '#ffffff', '#e48fb3', '#b893ff'];
  const col = cols[(Math.random() * cols.length) | 0];
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, sp = .4 + Math.random() * 1.1;
    particles.push({ x: pt[0], y: pt[1], vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .8, life: 50 + Math.random() * 30, max: 80, col });
  }
}
function yacht(st, t, bx, by) {
  box(bx + 2.1, by + 1.0, .28, 1.75, 2, '#8a5a35');                 // molo
  for (let k = 0; k < 4; k++) { const q = P(bx + 2.1, by + 1.2 + k * .45, 2); px(q[0], q[1] - 2, '#5e3b20', 1, 3); }
  let yx, yy, wob = 0;
  if (st === 'hotovo') { yx = bx + 1.72; yy = by + 2.0; }
  else if (st === 'volba') { yx = bx + .7 + .15 * Math.sin(t * .5); yy = by + 2.3; }
  else if (st === 'stojim') { yx = bx + 1.72; yy = by + 1.45; wob = Math.round(Math.sin(t * 14)); }
  else { const s = (Math.sin(t * .6) + 1) / 2; yx = bx + .5 + s * 1.15; yy = by + 1.95 + .4 * Math.sin(t * .35); }
  const q = P(yx, yy); const x = q[0] + wob, y = q[1];
  if (st !== 'hotovo' && st !== 'stojim') { px(x - 9, y + 1, '#a9d1f5', 3, 1); px(x - 12, y + 2, '#a9d1f5', 2, 1); }
  poly(c, [[x - 6, y - 1], [x + 7, y - 1], [x + 5, y + 2], [x - 4, y + 2]], '#ffffff');
  px(x - 5, y - 1, '#8a5a35', 11, 1);
  seg(c, [x, y - 1], [x, y - 14], '#dddddd');
  poly(c, [[x + 1, y - 14], [x + 1, y - 2], [x + 7, y - 2]], '#f4f1e8');
  poly(c, [[x - 1, y - 12], [x - 1, y - 2], [x - 5, y - 2]], '#dfe7ef');
  if (st === 'hotovo') { px(x, y - 17, '#e2603f', 4, 2); }
}
function drawParcel(p, t, dt) {
  const { i, j, theme, color } = p.layout;
  const bx = 1 + 4 * i, by = 1 + 4 * j;
  const st = getStage(p);
  const target = HEIGHT[st] * p.fullH;
  p.h += (target - p.h) * Math.min(1, dt * 2.2); if (Math.abs(target - p.h) < .2) p.h = target;
  const fp = theme === 'harbor' ? { x: bx + .25, y: by + .12, w: 1.7, d: .72 } : { x: bx + .45, y: by + .45, w: 2.1, d: 2.1 };
  const h = p.h;

  if (p.flash > 0) {
    const a = Math.min(1, p.flash / 2) * (.5 + .5 * Math.sin(t * 10));
    c.strokeStyle = `rgba(255,255,255,${a})`; c.lineWidth = 1;
    c.beginPath(); [P(bx, by), P(bx + 3, by), P(bx + 3, by + 3), P(bx, by + 3)].forEach((q, k) => k ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.stroke();
  }

  let cyc = null;
  if (theme === 'bike' && st !== 'volba') {
    c.strokeStyle = '#c4473f'; c.lineWidth = 2; c.beginPath();
    [P(bx + .15, by + .15), P(bx + 2.85, by + .15), P(bx + 2.85, by + 2.85), P(bx + .15, by + 2.85)].forEach((q, k) => k ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]));
    c.closePath(); c.stroke();
    cyc = cyclist(bx, by, t);
    if (cyc.back) cyc.draw();
  }

  if (st === 'volba') {
    flat(c, fp.x, fp.y, fp.w, fp.d, 0, '#6b4426');
    flat(c, fp.x + .2, fp.y + .2, Math.max(.1, fp.w - .4), Math.max(.1, fp.d - .4), 0, '#3f2715');
    box(fp.x + fp.w - .25, fp.y - .28, .5, .35, 3, '#8a5a32');
    const ex = fp.x + .15 + .25 * Math.sin(t * .8), ey = Math.min(by + 2.55, fp.y + fp.d + .15);
    box(ex, ey, .5, .3, 3, '#f2b705'); box(ex + .1, ey + .05, .22, .2, 3, '#2b2b2b', 3);
    const a = P(ex + .5, ey + .15, 4), b = P(ex + .85, ey - .1, 7 + 2 * Math.sin(t * 2));
    seg(c, a, b, '#f2b705'); seg(c, b, [b[0] + 1, b[1] + 4], '#f2b705');
    const sp = P(fp.x - .1, fp.y + fp.d * .5, 0);
    seg(c, sp, [sp[0], sp[1] - 8], '#6b4a2b');
    px(sp[0] - 4, sp[1] - 13, '#f5d128', 8, 5); px(sp[0] - 3, sp[1] - 12, '#333', 6, 1); px(sp[0] - 3, sp[1] - 10, '#333', 4, 1);
  } else {
    if (h > 1) { box(fp.x, fp.y, fp.w, fp.d, h, color); windows(p, fp, h, t, theme); }
    if (h > 4) {
      if (theme === 'cards') {
        const cols = ['#f0606d', '#f5d128', '#5aa0e0', '#7ed957'];
        for (let u = 0; u < 3; u++) for (let w = 0; w < 3; w++) {
          const idx = u * 3 + w;
          const ci = st === 'hotovo' ? u : hash(p.id + idx + '-' + Math.floor(t / 1.2) * (idx % 3 + 1)) % 4;
          const pt = P(fp.x + (u + .5) / 3 * fp.w, fp.y + (w + .5) / 3 * fp.d, h);
          px(pt[0] - 2, pt[1] - 1, cols[ci], 4, 2);
        }
      } else if (theme === 'calc') {
        const q = P(fp.x + fp.w / 2, fp.y + fp.d / 2, h);
        seg(c, [q[0] - 4, q[1]], [q[0] - 4, q[1] - 6], '#444'); seg(c, [q[0] + 4, q[1]], [q[0] + 4, q[1] - 6], '#444');
        px(q[0] - 7, q[1] - 16, '#1f2a1f', 14, 10); px(q[0] - 6, q[1] - 15, '#7ed957', 12, 3);
        for (let k = 0; k < 3; k++) for (let m = 0; m < 2; m++) px(q[0] - 6 + k * 4 + ((Math.floor(t * 3) + k + m) % 2), q[1] - 11 + m * 3, '#d8dccf', 2, 2);
      } else if (theme === 'meet') {
        const spots = [[.3, .3], [.7, .55], [.4, .75]], sp = spots[Math.floor(t / 1.4) % 3];
        const q = P(fp.x + sp[0] * fp.w, fp.y + sp[1] * fp.d, h + 10);
        px(q[0] - 5, q[1] - 4, '#ffffff', 11, 7); px(q[0] - 2, q[1] + 3, '#ffffff', 2, 2);
        for (let k = 0; k < 3; k++) px(q[0] - 3 + k * 3, q[1] - 1, '#333', 1, 1);
      } else if (theme === 'chart') {
        const cols = ['#7ed957', '#5aa0e0', '#f5d128', '#e2603f'];
        for (let k = 0; k < 4; k++) {
          const f = .18 + k * .21, base = P(fp.x + fp.w, fp.y + fp.d - f * fp.d, 3);
          const bh = Math.max(2, (h - 7) * (.3 + .65 * (.5 + .5 * Math.sin(t * .9 + k * 1.4))));
          px(base[0] - 1, base[1] - bh, cols[k], 3, bh);
        }
      }
    }
    if (theme === 'meet') dog(bx, by, t);
    if (['jedu', 'zpomaluju', 'stojim', 'oponentura'].includes(st)) scaffold(fp, p.fullH, st === 'oponentura' ? .45 : .95);
    if (['jedu', 'zpomaluju', 'stojim'].includes(st)) crane(p, st, t, bx, by);
    if (st === 'stojim') { cones(bx, by); towTruck(bx - .72, by + 1.0, t, true); }
    if (st === 'oponentura') inspector(bx, by, t);
    if (st === 'hotovo') {
      flag(fp, h, t, '#e2603f');
      p.fw -= 1;
      if (p.fw <= 0) { p.fw = 80 + Math.random() * 100; burst(P(fp.x + fp.w / 2, fp.y + fp.d / 2, h + 22 + Math.random() * 18)); }
    }
  }
  if (theme === 'harbor') yacht(st, t, bx, by);
  if (cyc && !cyc.back) cyc.draw();
}
function drawHQ(t, anyStuck) {
  const bx = 5, by = 5, Hh = 50;
  box(bx + .55, by + .55, 1.9, 1.9, Hh, '#2b3d68');
  const r = rng(99);
  for (let z = 5; z < Hh - 3; z += 6) for (const side of [0, 1]) for (let k = 1; k <= 3; k++) {
    const f = k / 4;
    const pt = side ? P(bx + 2.45, by + 2.45 - f * 1.9, z) : P(bx + .55 + f * 1.9, by + 2.45, z);
    px(pt[0] - 1, pt[1] - 2, r() < .7 ? '#ffe8a3' : '#33415f', 2, 2);
  }
  box(bx + 1.15, by + 1.15, .7, .7, 5, '#3a4f80', Hh);
  const q = P(bx + 1.5, by + 1.5, Hh + 5);
  seg(c, q, [q[0], q[1] - 12], '#cccccc');
  px(q[0] + 1, q[1] - 12, '#e2603f', 6, 2); px(q[0] + 1 + (Math.floor(t * 4) % 2), q[1] - 10, '#e2603f', 6, 2);
  if (Math.floor(t * 1.5) % 2) px(q[0] - 1, q[1] - 14, '#ff3b3b', 2, 2);
  if (!anyStuck) towTruck(bx - .72, by + 1.0, t, false);
}
function drawPark() {
  const bx = 1, by = 1;
  const trees = [[.5, .6], [1.6, .4], [2.4, 1.1], [.7, 1.7], [1.7, 1.6], [2.3, 2.4], [1.0, 2.5], [2.6, .4]].sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
  flat(c, bx + .9, by + .9, 1.0, .6, 0, '#4f86c9');
  for (const [u, w] of trees) {
    const q = P(bx + u, by + w, 0);
    px(q[0], q[1] - 4, '#6b4a2b', 1, 4);
    poly(c, [[q[0], q[1] - 15], [q[0] + 5, q[1] - 5], [q[0] - 5, q[1] - 5]], '#2f6b34');
    poly(c, [[q[0], q[1] - 15], [q[0] + 5, q[1] - 5], [q[0], q[1] - 5]], '#245428');
  }
}
function drawCar(car) {
  const x = car.axis === 'h' ? car.p : car.line + .5 + (car.v > 0 ? -.2 : .2);
  const y = car.axis === 'h' ? car.line + .5 + (car.v > 0 ? .2 : -.2) : car.p;
  if (car.p < .3 || car.p > N - .3) return;
  if (car.axis === 'h') { box(x - .22, y - .13, .44, .26, 3, car.col); box(x - .1, y - .11, .2, .22, 2, shade(car.col.length === 7 ? car.col : '#888888', 1.2).replace('rgb', 'rgb'), 3); }
  else { box(x - .13, y - .22, .26, .44, 3, car.col); }
}
function drawTram(t) {
  const x = (N - 1.9) * (.5 - .5 * Math.cos(t * .12)) + .05, y = 12.32;
  box(x, y, 1.8, .36, 6, '#d8402f');
  box(x, y, 1.8, .36, 2, '#f4f1e8', 2);
  for (let k = 0; k < 5; k++) { const q = P(x + .2 + k * .33, y + .36, 4); px(q[0] - 1, q[1] - 2, '#2b3a55', 2, 2); }
}

// ---------- hlavní smyčka ----------
let scale = 1, offX = 0, offY = 0, last = performance.now();
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.floor(innerWidth * dpr); view.height = Math.floor(innerHeight * dpr);
  scale = Math.min(view.width / W, view.height / H);
  offX = (view.width - W * scale) / 2; offY = (view.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

function frame(nowMs) {
  const t = (nowMs - t0) / 1000, dt = Math.min(.05, (nowMs - last) / 1000); last = nowMs;
  for (const car of cars) { car.p += car.v * dt; if (car.p > N) car.p -= N; if (car.p < 0) car.p += N; }
  for (const id in parcels) if (parcels[id].flash > 0) parcels[id].flash -= dt;

  c.fillStyle = '#0b1322'; c.fillRect(0, 0, W, H);
  for (const [sx, sy, big] of stars) px(sx, sy, big && Math.floor(t + sx) % 3 ? '#6d7fa3' : '#2a3a5c', 1, 1);
  c.drawImage(ground, 0, 0);
  const fr = Math.floor(t * 3);
  for (let k = 0; k < 16; k++) {
    const r1 = frac(Math.sin((k + 1) * 12.9898 + fr * 78.233) * 43758.5453), r2 = frac(Math.sin((k + 1) * 93.989 + fr * 11.13) * 24634.63);
    const q = P(9 + r1 * 3, 10 + r2 * 2); px(q[0], q[1], '#a9d1f5', 2, 1);
  }

  const anyStuck = Object.values(parcels).some(p => getStage(p) === 'stojim');
  const list = [{ k: 5, f: drawPark }, { k: 13, f: () => drawHQ(t, anyStuck) }];
  for (const id in parcels) { const p = parcels[id]; const { i, j } = p.layout; list.push({ k: (1 + 4 * i) + (1 + 4 * j) + 3, f: () => drawParcel(p, t, dt) }); }
  for (const car of cars) {
    const x = car.axis === 'h' ? car.p : car.line + .5, y = car.axis === 'h' ? car.line + .5 : car.p;
    list.push({ k: x + y, f: () => drawCar(car) });
  }
  list.push({ k: 12.5 + (N - 1.9) * (.5 - .5 * Math.cos(t * .12)) + .9, f: () => drawTram(t) });
  list.sort((a, b) => a.k - b.k);
  for (const it of list) it.f();

  particles = particles.filter(q => q.life > 0);
  for (const q of particles) {
    q.x += q.vx; q.y += q.vy; q.vy += .02; q.vx *= .985; q.life--;
    const big = q.life > q.max - 18;
    c.globalAlpha = Math.min(1, q.life / 30);
    px(q.x, q.y, q.col, big ? 2 : 1, big ? 2 : 1);
  }
  c.globalAlpha = 1;
  for (const cl of clouds) {
    cl.x += cl.s; if (cl.x > W + 30) cl.x = -40;
    const x = R(cl.x), y = cl.y;
    c.globalAlpha = .92;
    px(x, y, '#e9eef6', cl.w, 4); px(x + 3, y - 3, '#e9eef6', cl.w - 7, 3); px(x + 2, y + 4, '#c3cee0', cl.w - 3, 1);
    c.globalAlpha = 1;
  }

  v.imageSmoothingEnabled = false;
  v.fillStyle = '#0b1322'; v.fillRect(0, 0, view.width, view.height);
  v.drawImage(low, 0, 0, W, H, offX, offY, W * scale, H * scale);
  drawLabels();
  requestAnimationFrame(frame);
}

function drawLabels() {
  const items = [];
  for (const id in parcels) {
    const p = parcels[id]; const { i, j, theme } = p.layout;
    const bx = 1 + 4 * i, by = 1 + 4 * j, st = getStage(p);
    const ax = theme === 'harbor' ? bx + 1.1 : bx + 1.5, ay = theme === 'harbor' ? by + .5 : by + 1.5;
    const a = P(ax, ay, (st === 'volba' ? 8 : p.h) + 16);
    items.push({ x: a[0], y: a[1], name: p.name, proj: p.project, st, depth: bx + by });
  }
  const hq = P(6.5, 6.5, 70);
  items.push({ x: hq[0], y: hq[1], name: 'Stavební úřad HoŘ', proj: 'Marek a Nikol', st: null, depth: 10 });
  items.sort((a, b) => a.depth - b.depth);
  for (const it of items) drawLabel(it);
}
function drawLabel(it) {
  const x = offX + it.x * scale, y = offY + it.y * scale;
  const fs = Math.max(14, 5.4 * scale);
  const fName = `400 ${fs}px "VT323", ui-monospace, monospace`;
  const fProj = `400 ${fs * .82}px "VT323", ui-monospace, monospace`;
  const fChip = `400 ${fs * .78}px "VT323", ui-monospace, monospace`;
  const chip = it.st ? (it.st === 'stojim' ? 'Stojím · Nikol jede' : STAGE_LABEL[it.st]) : null;
  v.font = fName; const w1 = v.measureText(it.name).width;
  v.font = fProj; const w2 = it.proj ? v.measureText(it.proj).width : 0;
  v.font = fChip; const wc = chip ? v.measureText(chip).width + fs * .6 : 0;
  const pad = fs * .45;
  const bw = Math.max(w1 + (chip ? wc + pad : 0), w2) + pad * 2 + fs * .2;
  const bh = fs * (it.proj ? 2.05 : 1.15) + pad * 1.2;
  const left = x - bw / 2, top = y - bh - fs * .5;
  v.fillStyle = 'rgba(11,19,34,.9)';
  v.fillRect(left, top, bw, bh);
  v.beginPath(); v.moveTo(x - fs * .45, top + bh); v.lineTo(x + fs * .45, top + bh); v.lineTo(x, top + bh + fs * .5); v.closePath(); v.fill();
  v.fillStyle = it.st ? STAGE_COL[it.st] : '#e2603f';
  v.fillRect(left, top, Math.max(3, fs * .22), bh);
  v.textBaseline = 'top';
  const tx = left + pad + fs * .2, ty = top + pad * .65;
  v.font = fName; v.fillStyle = '#ffffff'; v.fillText(it.name, tx, ty); v.fillText(it.name, tx + Math.max(1, fs * .04), ty);
  if (chip) {
    const cx = tx + w1 + pad;
    v.fillStyle = STAGE_COL[it.st]; v.fillRect(cx, ty + fs * .05, wc, fs * .95);
    v.font = fChip; v.fillStyle = '#0b1322'; v.fillText(chip, cx + fs * .3, ty + fs * .12);
  }
  if (it.proj) { v.font = fProj; v.fillStyle = '#9db0cf'; v.fillText(it.proj, tx, ty + fs * 1.12); }
}

// ---------- start ----------
addEventListener('keydown', e => {
  if (e.key === 'd') { demo = !demo; updateStats(); }
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
buildGround();
loadState(); setInterval(loadState, 15000);
tickClock(); setInterval(() => { tickClock(); updateStats(); }, 1000);
requestAnimationFrame(frame);
})();
</script>
